<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADNIME - by JIYYAD TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #15151e;
    --border: rgba(255,255,255,0.08);
    --accent: #00e5ff;
    --accent-pink: #ff3366;
    --text: #ffffff;
    --text-muted: #9a9aa5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 10% 10%, rgba(0,229,255,0.06), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255,51,102,0.06), transparent 40%);
    background-attachment: fixed;
  }
  svg { fill: currentColor; }
  a { color: inherit; text-decoration: none; }
  img { -webkit-user-drag: none; user-select: none; }

  /* ================= NAVBAR ================= */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: 70px;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
  }
  .nav-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand {
    font-size: 24px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex; align-items: center; gap: 8px;
  }
  .brand svg { width: 28px; height: 28px; fill: var(--accent); }
  .owner-badge {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1.5px;
    border: 1px solid var(--border); padding: 4px 10px;
    border-radius: 12px;
  }
  .search-wrap {
    flex: 1; max-width: 400px; margin-left: auto;
    position: relative; display: flex; align-items: center;
  }
  .search-wrap > svg { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--text-muted); }
  #searchInput {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; padding: 10px 18px 10px 42px;
    color: #fff; font-family: inherit; font-size: 14px; outline: none; transition: 0.3s;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,229,255,0.2); }

  /* ================= CONTAINER ================= */
  .container { padding: 100px 5% 60px; max-width: 1400px; margin: 0 auto; min-height: 100vh; }
  
  .section-title {
    font-size: 22px; font-weight: 800; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before {
    content: ''; width: 4px; height: 22px; background: var(--accent); border-radius: 2px;
  }

  /* ================= GRID & CARDS ================= */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column;
    position: relative;
  }
  .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 10px 25px rgba(0,229,255,0.15); }
  .card-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #1a1a25; display: block; }
  .card-badge {
    position: absolute; top: 8px; left: 8px;
    background: var(--accent-pink); color: #fff;
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
    text-transform: uppercase;
  }
  .card-title {
    padding: 12px; font-size: 13px; font-weight: 700; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ================= LOADING & ERRORS ================= */
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .error-msg h3 { color: var(--accent-pink); margin-bottom: 8px; font-size: 20px; }
  .error-msg button {
    margin-top: 16px; background: var(--accent); color: #000;
    border: none; padding: 10px 24px; border-radius: 8px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }

  /* ================= DETAIL PAGE ================= */
  .detail-header { display: flex; gap: 30px; margin-bottom: 40px; flex-wrap: wrap; }
  .detail-cover {
    width: 240px; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #1a1a25;
  }
  .detail-info { flex: 1; min-width: 300px; }
  .detail-title { font-size: 32px; font-weight: 900; margin-bottom: 10px; line-height: 1.2; }
  .detail-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .meta-tag {
    background: var(--card); border: 1px solid var(--border); padding: 6px 12px;
    border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--text-muted);
  }
  .detail-desc { font-size: 14px; line-height: 1.8; color: #ccc; margin-bottom: 20px; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); color: #fff;
    padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer;
    margin-bottom: 20px; font-family: inherit; transition: 0.2s;
  }
  .btn-back:hover { border-color: var(--accent); color: var(--accent); }

  .episode-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .ep-item {
    background: var(--card); border: 1px solid var(--border); color: #fff;
    padding: 12px; border-radius: 8px; font-weight: 700; font-size: 13px;
    text-align: center; cursor: pointer; transition: 0.2s; font-family: inherit;
  }
  .ep-item:hover { background: var(--accent); color: #000; border-color: var(--accent); }

  /* ================= PLAYER VIEW ================= */
  .player-container { max-width: 1000px; margin: 0 auto; }
  .video-wrapper {
    width: 100%; aspect-ratio: 16/9; background: #000;
    border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
    margin-bottom: 20px; position: relative;
  }
  .video-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .player-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .player-title { font-size: 20px; font-weight: 800; }
  .server-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .server-btn {
    background: var(--card); border: 1px solid var(--border); color: #fff;
    padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: 0.2s; font-family: inherit;
  }
  .server-btn:hover, .server-btn.active { background: var(--accent-pink); border-color: var(--accent-pink); }

  @media (max-width: 768px) {
    .detail-cover { width: 140px; }
    .detail-title { font-size: 22px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .brand { font-size: 20px; }
    .owner-badge { display: none; }
    .container { padding: 90px 4% 40px; }
    nav { padding: 0 4%; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-left" onclick="goHome()">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15l7-4-7-4v8z"/></svg>
      ADNIME
    </div>
    <div class="owner-badge">by JIYYAD TOOLS</div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Cari anime di Nimegami..." autocomplete="off">
  </div>
</nav>

<div class="container" id="app">
  <div class="spinner"></div>
</div>

<script>
/* ================= CONFIG ================= */
const BASE_URL = 'https://nimegami.id';
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
];

/* ================= STATE ================= */
let searchTimeout;
let currentEpisodes = [];
let currentAnimeTitle = '';

/* ================= UTILS ================= */
const app = document.getElementById('app');
const searchInput = document.getElementById('searchInput');

async function fetchHTML(url) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(url), { signal: AbortSignal.timeout(15000) });
      if (!res.ok) { lastErr = new Error(`HTTP ${res.status}`); continue; }
      const text = await res.text();
      if (text && text.length > 1000) return text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Semua proxy gagal');
}

function parseDoc(html) {
  return new DOMParser().parseFromString(html, 'text/html');
}

function absolute(url) {
  if (!url) return '';
  if (url.startsWith('http')) return url;
  return new URL(url, BASE_URL).href;
}

/* ================= EXTRACTORS ================= */
function extractCards(doc) {
  const results = [];
  const seen = new Set();

  // Selector Nimegami biasanya menggunakan article atau div.bs
  const elements = doc.querySelectorAll('article, .bs, .anime-card, .listupd .bs');
  
  elements.forEach(el => {
    const a = el.querySelector('a[href]');
    if (!a) return;
    
    const url = absolute(a.getAttribute('href'));
    if (seen.has(url) || !url.includes(BASE_URL)) return;

    // Judul
    const titleEl = el.querySelector('h2, h3, .tt, .title');
    const title = titleEl ? titleEl.textContent.trim() : (a.getAttribute('title') || a.textContent.trim());
    if (!title) return;

    // Gambar
    const img = el.querySelector('img');
    let cover = '';
    if (img) {
      cover = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src');
      cover = absolute(cover);
    }

    // Tipe & Episode (jika ada)
    const epEl = el.querySelector('.ep, .epx, .status');
    const epText = epEl ? epEl.textContent.trim() : '';

    seen.add(url);
    results.push({ title, url, cover, epText });
  });

  return results;
}

function extractDetail(doc, url) {
  const titleEl = doc.querySelector('h1.entry-title, h1');
  const title = titleEl ? titleEl.textContent.trim() : 'Unknown Anime';

  const descEl = doc.querySelector('.entry-content, .sinopsis, .desc');
  const synopsis = descEl ? descEl.textContent.trim() : 'Sinopsis tidak tersedia.';

  const imgEl = doc.querySelector('.thumb img, .spe img, meta[property="og:image"]');
  let cover = '';
  if (imgEl) {
    cover = imgEl.getAttribute('content') || imgEl.getAttribute('src');
    cover = absolute(cover);
  }

  const episodes = [];
  // Link episode biasanya ada di .eplister ul li a atau a yang mengandung "-episode-"
  const epLinks = doc.querySelectorAll('.eplister a, a[href*="-episode-"]');
  epLinks.forEach(a => {
    const href = a.getAttribute('href');
    const text = a.textContent.trim();
    if (href && text) {
      const epUrl = absolute(href);
      if (!episodes.find(e => e.url === epUrl)) {
        episodes.push({ url: epUrl, title: text });
      }
    }
  });

  // Sort episode dari kecil ke besar (jika memungkinkan)
  episodes.sort((a, b) => {
    const numA = parseInt(a.title.match(/\d+/) || 0);
    const numB = parseInt(b.title.match(/\d+/) || 0);
    return numA - numB;
  });

  return { title, synopsis, cover, episodes };
}

function extractPlayer(doc, episodeUrl) {
  const iframes = [];
  // Cari iframe di area player
  const iframeEls = doc.querySelectorAll('.player-embed iframe, #pembed iframe, iframe');
  
  iframeEls.forEach(iframe => {
    let src = iframe.getAttribute('src') || iframe.getAttribute('data-src');
    if (src) {
      src = absolute(src);
      if (!iframes.find(i => i.url === src)) {
        // Kasih label server sederhana berdasarkan domain
        let label = 'Server 1';
        try {
          const host = new URL(src).hostname;
          if (host.includes('desustream')) label = 'DesuStream';
          else if (host.includes('blogspot')) label = 'Blogger';
          else if (host.includes('pixeldrain')) label = 'PixelDrain';
          else label = host.split('.')[0];
        } catch(e) {}
        
        iframes.push({ url: src, label: label.charAt(0).toUpperCase() + label.slice(1) });
      }
    }
  });

  return iframes;
}

/* ================= VIEWS ================= */
async function goHome() {
  searchInput.value = '';
  app.innerHTML = '<div class="spinner"></div>';
  
  try {
    const html = await fetchHTML(BASE_URL);
    const doc = parseDoc(html);
    const cards = extractCards(doc);

    if (cards.length === 0) throw new Error('Tidak ada anime ditemukan');

    app.innerHTML = `
      <h2 class="section-title">Rilisan Terbaru</h2>
      <div class="grid">
        ${cards.map(c => `
          <div class="card" onclick="openDetail('${c.url.replace(/'/g, "\\'")}')">
            <img class="card-img" src="${c.cover}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 140\\'><rect fill=\\'#1a1a25\\' width=\\'100\\' height=\\'140\\'/></svg>'">
            ${c.epText ? `<div class="card-badge">${c.epText}</div>` : ''}
            <div class="card-title">${c.title}</div>
          </div>
        `).join('')}
      </div>
    `;
  } catch (e) {
    app.innerHTML = `<div class="error-msg">
      <h3>Gagal Memuat Data</h3>
      <p>${e.message}. Server sumber mungkin sedang down atau diblokir proxy.</p>
      <button onclick="goHome()">Coba Lagi</button>
    </div>`;
  }
}

async function openDetail(url) {
  app.innerHTML = '<div class="spinner"></div>';
  window.scrollTo(0, 0);

  try {
    const html = await fetchHTML(url);
    const doc = parseDoc(html);
    const detail = extractDetail(doc, url);
    
    currentAnimeTitle = detail.title;
    currentEpisodes = detail.episodes;

    app.innerHTML = `
      <button class="btn-back" onclick="goHome()">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Kembali
      </button>
      
      <div class="detail-header">
        <img class="detail-cover" src="${detail.cover}" alt="${detail.title}">
        <div class="detail-info">
          <h1 class="detail-title">${detail.title}</h1>
          <div class="detail-meta">
            <span class="meta-tag">Sub Indo</span>
            <span class="meta-tag">${detail.episodes.length} Episode</span>
          </div>
          <p class="detail-desc">${detail.synopsis}</p>
        </div>
      </div>

      <h2 class="section-title" style="margin-top: 40px;">Daftar Episode</h2>
      ${detail.episodes.length > 0 ? `
        <div class="episode-list">
          ${detail.episodes.map(ep => `
            <button class="ep-item" onclick="openPlayer('${ep.url.replace(/'/g, "\\'")}', '${ep.title.replace(/'/g, "\\'")}')">
              ${ep.title}
            </button>
          `).join('')}
        </div>
      ` : '<div class="error-msg"><p>Link episode belum tersedia untuk anime ini.</p></div>'}
    `;
  } catch (e) {
    app.innerHTML = `<div class="error-msg">
      <h3>Gagal Memuat Detail</h3>
      <p>${e.message}</p>
      <button onclick="goHome()">Kembali ke Beranda</button>
    </div>`;
  }
}

async function openPlayer(url, epTitle) {
  app.innerHTML = '<div class="spinner"></div>';
  window.scrollTo(0, 0);

  try {
    const html = await fetchHTML(url);
    const doc = parseDoc(html);
    const servers = extractPlayer(doc, url);

    if (servers.length === 0) {
      throw new Error('Link video (iframe) tidak ditemukan di halaman ini.');
    }

    app.innerHTML = `
      <div class="player-container">
        <button class="btn-back" onclick="openDetail('${currentEpisodes[0].url.split('-episode-')[0]}-sub-indo/')">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Kembali ke Detail
        </button>
        
        <div class="player-nav">
          <div class="player-title">${currentAnimeTitle} - ${epTitle}</div>
        </div>

        <div class="video-wrapper" id="videoWrapper">
          <iframe id="mainIframe" src="${servers[0].url}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="origin"></iframe>
        </div>

        <div class="server-list">
          ${servers.map((s, i) => `
            <button class="server-btn ${i === 0 ? 'active' : ''}" onclick="switchServer(this, '${s.url.replace(/'/g, "\\'")}')">
              ${s.label}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  } catch (e) {
    app.innerHTML = `<div class="error-msg">
      <h3>Gagal Memuat Video</h3>
      <p>${e.message}</p>
      <button onclick="goHome()">Kembali ke Beranda</button>
    </div>`;
  }
}

function switchServer(btn, url) {
  document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('mainIframe').src = url;
}

/* ================= SEARCH ================= */
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  
  if (q.length === 0) { goHome(); return; }
  if (q.length > 2) {
    searchTimeout = setTimeout(() => searchAnime(q), 700);
  }
});

async function searchAnime(query) {
  app.innerHTML = '<div class="spinner"></div>';
  
  try {
    const url = `${BASE_URL}/?s=${encodeURIComponent(query)}`;
    const html = await fetchHTML(url);
    const doc = parseDoc(html);
    const cards = extractCards(doc);

    if (cards.length === 0) {
      app.innerHTML = `<div class="error-msg">
        <h3>Tidak Ada Hasil</h3>
        <p>Anime "${query}" tidak ditemukan di database.</p>
        <button onclick="goHome()">Kembali ke Beranda</button>
      </div>`;
      return;
    }

    app.innerHTML = `
      <h2 class="section-title">Hasil Pencarian: "${query}"</h2>
      <div class="grid">
        ${cards.map(c => `
          <div class="card" onclick="openDetail('${c.url.replace(/'/g, "\\'")}')">
            <img class="card-img" src="${c.cover}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 140\\'><rect fill=\\'#1a1a25\\' width=\\'100\\' height=\\'140\\'/></svg>'">
            ${c.epText ? `<div class="card-badge">${c.epText}</div>` : ''}
            <div class="card-title">${c.title}</div>
          </div>
        `).join('')}
      </div>
    `;
  } catch (e) {
    app.innerHTML = `<div class="error-msg">
      <h3>Pencarian Gagal</h3>
      <p>${e.message}</p>
      <button onclick="goHome()">Kembali ke Beranda</button>
    </div>`;
  }
}

/* ================= INIT ================= */
goHome();
</script>
</body>
</html>
